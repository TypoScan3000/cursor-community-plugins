name: Supabase migrations

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-migrations.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  # Report-only: lists what production is missing without applying anything.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Migrations apply to a fresh database
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Apply all migrations
        run: supabase db start

  production:
    name: Apply to production
    # Stays off until a maintainer sets the SUPABASE_PROJECT_ID repository
    # variable; see "Database migrations" in the README.
    if: github.event_name != 'pull_request' && vars.SUPABASE_PROJECT_ID != ''
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: supabase-production
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Migration history (repo vs production)
        run: supabase migration list

      - name: Check pending migrations
        id: pending
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # The CLI already refuses when production's history and the repo
          # disagree (a version missing from the repo, or a new file older than
          # the last applied one) and prints how to repair it.
          if ! result=$(supabase db push --dry-run --output-format json); then
            echo "$result"
            exit 1
          fi
          pending=$(jq -r '.migrations[]' <<<"$result")

          if [ -z "$pending" ]; then
            echo "Production is up to date."
            echo "apply=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Pending migrations:"
          echo "$pending"

          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "Manual runs only report; nothing was applied."
            echo "apply=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Only apply files this push added, so a history that's out of sync
          # with the repo can never replay older migrations against production.
          added=$(git diff --name-only --diff-filter=A "$BEFORE" "$GITHUB_SHA" -- supabase/migrations | xargs -r -n1 basename)
          unexpected=$(comm -23 <(sort <<<"$pending") <(sort <<<"$added"))
          if [ -n "$unexpected" ]; then
            echo "::error::Production is missing migrations this push didn't add: $(tr '\n' ' ' <<<"$unexpected"). Reconcile the migration history (README, Database migrations) before applying."
            exit 1
          fi

          edited=$(git diff --name-only --diff-filter=M "$BEFORE" "$GITHUB_SHA" -- supabase/migrations)
          if [ -n "$edited" ]; then
            echo "::warning::Edits to already-applied migrations don't run again: $(tr '\n' ' ' <<<"$edited")"
          fi

          echo "apply=true" >> "$GITHUB_OUTPUT"

      - name: Apply
        if: steps.pending.outputs.apply == 'true'
        run: supabase db push
